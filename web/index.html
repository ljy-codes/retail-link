<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151929">
  <title>电商看盘 · 零售通</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/daily.css">
  <link rel="stylesheet" href="/dataset.css">
  <link rel="stylesheet" href="/desktop.css">
  <link rel="stylesheet" href="/ui-foundation.css">
  <link rel="stylesheet" href="/appearance.css">
  <script src="/appearance.js"></script>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6" height="6" rx="1.5"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.5"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.5"/><rect x="14.5" y="14.5" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 14v3m5-8v8m5-12v12"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8m-8 4h5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9M7.5 5.5l9 5"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 5h12v12H2zM14 9h4l4 4v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m10.3 4.1-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-2.9l-8-14a2 2 0 0 0-3.4 0zM12 9v4m0 4h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 7a7 7 0 0 1 11.5-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6zM13 6l5 5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-8z"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11m6-11v11"/></symbol>
  </svg>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="零售通首页"><span class="brand-mark"><span></span><span></span><span></span></span><span>零售通<small>RETAIL LINK</small></span></a>
    <div class="workspace-label">我的工作空间 <span>探索版</span></div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-nav="dashboard" aria-label="电商看盘"><svg class="icon"><use href="#i-chart"/></svg><span>电商看盘</span><span class="nav-dot"></span></button>
      <button class="nav-item" data-action="open-import" aria-label="数据导入"><svg class="icon"><use href="#i-folder"/></svg><span>数据导入</span></button>
      <button class="nav-item" data-action="open-history" aria-label="历史记录"><svg class="icon"><use href="#i-clock"/></svg><span>历史记录</span></button>
      <button class="nav-item" data-action="open-data-tools" aria-label="本地数据与记录"><svg class="icon"><use href="#i-download"/></svg><span>本地数据与记录</span></button>
      <button class="nav-item" data-action="open-config" aria-label="分析配置"><svg class="icon"><use href="#i-settings"/></svg><span>分析配置</span></button>
    </nav>
    <div class="sidebar-note"><span class="note-symbol">＋</span><p>从看盘开始<small>逐步接入日常运营工具</small></p></div>
    <div class="sidebar-footer"><span class="local-dot"></span><div>本机工作空间<small>数据在本机处理</small></div><span class="version" id="app-version">v0.1.7</span></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb">工作台 <span>/</span><strong>电商看盘</strong></div><div class="topbar-right"><span class="local-status"><i></i> 本地运行</span><span class="avatar">运</span></div></header>
    <main id="app" tabindex="-1"></main>
    <footer class="page-footer"><span>零售通 · 电商看盘</span><span>用同一套口径，看清每一天</span></footer>
  </div>
  <input type="file" id="file-input" accept=".xlsx,.xlsm" multiple hidden>
  <div id="modal-root"></div><div id="drawer-root"></div>
  <div id="drag-overlay" hidden><div><svg class="icon"><use href="#i-upload"/></svg><h2>松开文件，开始分析</h2><p>支持 .xlsx 和 .xlsm 工作簿</p></div></div>
  <div id="busy-overlay" hidden aria-live="polite"><div class="busy-card"><div class="spinner"></div><strong id="busy-label">正在分析工作簿</strong><span>整理数据与计算指标，请稍候</span></div></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
  <script defer src="/daily.js"></script>
  <script defer src="/dataset.js"></script>
  <script defer src="/desktop.js"></script>
</body>
</html>
